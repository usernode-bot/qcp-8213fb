  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>

<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Fixed Header -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-slate-900 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-14">
      <div id="election-name" class="font-bold text-base truncate max-w-xs text-slate-100">QCP — Quick Count Portal</div>
      <nav class="flex gap-1 flex-shrink-0">
        <button class="tab-btn" data-view="results" onclick="showView('results')">Results</button>
        <button class="tab-btn" data-view="submit" onclick="showView('submit')">Submit</button>
        <button class="tab-btn" data-view="pending" onclick="showView('pending')">
          Pending<span id="pending-badge" class="hidden ml-1.5 bg-amber-500 text-black text-xs rounded-full px-1.5 leading-5 inline-block"></span>
        </button>
        <button id="admin-tab" class="tab-btn hidden" data-view="admin" onclick="showView('admin')">Admin</button>
      </nav>
    </div>
  </header>

  <!-- Main content -->
  <main class="pt-14">

    <!-- =================== RESULTS VIEW =================== -->
    <section id="view-results" class="max-w-7xl mx-auto px-4 py-6">
      <div id="results-reporting" class="text-center text-sm text-slate-400 mb-5"></div>
      <div id="candidate-cards" class="grid gap-4 mb-8" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr))"></div>

      <!-- Geo drill-down -->
      <div class="bg-slate-900 rounded-lg border border-slate-800">
        <div id="results-breadcrumb" class="px-4 py-3 border-b border-slate-800 text-sm text-slate-400 flex items-center gap-1 flex-wrap"></div>
        <div id="results-table" class="overflow-x-auto"></div>
      </div>

      <div id="results-footer" class="mt-3 text-center text-xs text-slate-600"></div>
    </section>

    <!-- =================== SUBMIT VIEW =================== -->
    <section id="view-submit" hidden class="max-w-2xl mx-auto px-4 py-6">
      <h2 class="text-xl font-bold mb-6">Submit Entry</h2>
      <div class="space-y-4 mb-6">
        <div>
          <label for="province-select">Province</label>
          <select id="province-select">
            <option value="">— Select Province —</option>
          </select>
        </div>
        <div>
          <label for="city-select">City / Regency</label>
          <select id="city-select" disabled>
            <option value="">— Select City —</option>
          </select>
        </div>
        <div>
          <label for="district-select">District (Kecamatan)</label>
          <select id="district-select" disabled>
            <option value="">— Select District —</option>
          </select>
        </div>
        <div>
          <label for="tps-select">TPS (Polling Station)</label>
          <select id="tps-select" disabled>
            <option value="">— Select TPS —</option>
          </select>
        </div>
      </div>
      <div id="tps-status-area"></div>
    </section>

    <!-- =================== PENDING VIEW =================== -->
    <section id="view-pending" hidden class="max-w-4xl mx-auto px-4 py-6">
      <h2 class="text-xl font-bold mb-2">Pending Confirmations</h2>
      <p class="text-sm text-slate-500 mb-6">Entries awaiting a second person to verify. You cannot confirm your own submissions.</p>
      <div id="pending-list"></div>
    </section>

    <!-- =================== ADMIN VIEW =================== -->
    <section id="view-admin" hidden class="max-w-5xl mx-auto px-4 py-6">
      <div id="admin-panel">
        <h2 class="text-xl font-bold mb-6">Admin Panel</h2>

        <!-- Admin sub-tabs -->
        <div class="flex gap-2 mb-6 border-b border-slate-800 pb-0">
          <button class="admin-tab px-4 py-2 text-sm font-medium border-b-2 -mb-px cursor-pointer bg-transparent border-transparent text-slate-400 hover:text-slate-200" data-atab="election" onclick="showAdminTab('election')">Election</button>
          <button class="admin-tab px-4 py-2 text-sm font-medium border-b-2 -mb-px cursor-pointer bg-transparent border-transparent text-slate-400 hover:text-slate-200" data-atab="candidates" onclick="showAdminTab('candidates')">Candidates</button>
          <button class="admin-tab px-4 py-2 text-sm font-medium border-b-2 -mb-px cursor-pointer bg-transparent border-transparent text-slate-400 hover:text-slate-200" data-atab="geography" onclick="showAdminTab('geography')">Geography</button>
          <button class="admin-tab px-4 py-2 text-sm font-medium border-b-2 -mb-px cursor-pointer bg-transparent border-transparent text-slate-400 hover:text-slate-200" data-atab="entries" onclick="showAdminTab('entries')">Entries</button>
          <button class="admin-tab px-4 py-2 text-sm font-medium border-b-2 -mb-px cursor-pointer bg-transparent border-transparent text-slate-400 hover:text-slate-200" data-atab="admins" onclick="showAdminTab('admins')">Admins</button>
        </div>

        <div id="admin-tab-election" class="admin-tab-content"></div>
        <div id="admin-tab-candidates" class="admin-tab-content hidden"></div>
        <div id="admin-tab-geography" class="admin-tab-content hidden"></div>
        <div id="admin-tab-entries" class="admin-tab-content hidden"></div>
        <div id="admin-tab-admins" class="admin-tab-content hidden"></div>
      </div>
    </section>

  </main>

<script>
'use strict';

const params = new URLSearchParams(window.location.search);
const TOKEN = params.get('token') || '';
const HEADERS = Object.assign({ 'Content-Type': 'application/json' }, TOKEN ? { 'x-usernode-token': TOKEN } : {});

const state = {
  election: null,
  candidates: [],
  isAdmin: false,
  isStaging: false,
  lastRefreshed: 0,
  refreshTimer: null,
  countdownTimer: null,
  drilldown: { level: 'national', id: null, path: [] },
  currentView: null,
};

async function api(url, opts) {
  const options = Object.assign({ headers: HEADERS }, opts || {});
  if (options.body && typeof options.body !== 'string') {
    options.body = JSON.stringify(options.body);
  }
  const res = await fetch(url, options);
  if (!res.ok) {
    let err;
    try { err = await res.json(); } catch (_) { err = { error: res.statusText }; }
    const e = new Error(err.error || res.statusText);
    e.status = res.status;
    throw e;
  }
  return res.json();
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function initials(name) {
  return (name || '').split(/\s+/).slice(0,2).map(w => w[0] || '').join('').toUpperCase();
}

function pct(v, total) {
  if (!total) return '0.0';
  return (v / total * 100).toFixed(1);
}

// ---- Init ----

async function init() {
  try {
    const [{ election, candidates }, { isAdmin }, { isStaging }] = await Promise.all([
      api('/api/elections/active'),
      api('/api/admin/check'),
      api('/api/status'),
    ]);
    state.election = election;
    state.candidates = candidates;
    state.isAdmin = isAdmin;
    state.isStaging = isStaging;

    if (election) {
      document.getElementById('election-name').textContent = election.name;
    }
    if (isAdmin) {
      document.getElementById('admin-tab').classList.remove('hidden');
    }
  } catch (e) {
    console.error('Init error:', e);
  }

  const view = params.get('view') || 'results';
  await showView(view);
  setupAutoRefresh();
}

// ---- View management ----

async function showView(name) {
  ['results', 'submit', 'pending', 'admin'].forEach(v => {
    document.getElementById('view-' + v).hidden = v !== name;
  });
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const active = btn.dataset.view === name;
    btn.classList.toggle('active', active);
  });
  state.currentView = name;

  if (name === 'results') await loadResults();
  else if (name === 'submit') await loadSubmit();
  else if (name === 'pending') await loadPending();
  else if (name === 'admin') await loadAdmin();
}

// ---- Results ----

async function loadResults() {
  if (!state.election) {
    document.getElementById('candidate-cards').innerHTML =
      '<p class="col-span-3 text-slate-500 text-center py-8">No active election. An admin can create one in the Admin panel.</p>';
    document.getElementById('results-reporting').textContent = '';
    document.getElementById('results-table').innerHTML = '';
    document.getElementById('results-breadcrumb').innerHTML = '';
    return;
  }
  await refreshResults();
}

async function refreshResults() {
  try {
    const [totals, provinces] = await Promise.all([
      api('/api/results'),
      api('/api/results/provinces'),
    ]);
    state.lastRefreshed = Date.now();
    renderCandidateCards(totals);

    // Restore drilldown or show provinces
    if (state.drilldown.level === 'national') {
      renderGeoTable('province', provinces, null);
    } else {
      await drillTo(state.drilldown.level, state.drilldown.id, state.drilldown.path, true);
    }
  } catch (e) {
    console.error('Results refresh error:', e);
  }
}

function renderCandidateCards(totals) {
  const totalVotes = totals.votes.reduce((s, v) => s + parseInt(v.total_votes), 0);
  const voteMap = {};
  for (const v of totals.votes) voteMap[v.candidate_id] = parseInt(v.total_votes);

  const pct_reported = totals.total_tps ? (totals.reported_tps / totals.total_tps * 100).toFixed(1) : '0.0';
  document.getElementById('results-reporting').innerHTML =
    `<strong class="text-slate-300">${totals.reported_tps.toLocaleString()}</strong> of <strong class="text-slate-300">${totals.total_tps.toLocaleString()}</strong> TPS reported <span class="text-slate-500">(${pct_reported}%)</span>`;

  if (!state.candidates.length) {
    document.getElementById('candidate-cards').innerHTML = '<p class="text-slate-500 col-span-3 text-center py-4">No candidates configured.</p>';
    return;
  }

  document.getElementById('candidate-cards').innerHTML = state.candidates.map(c => {
    const votes = voteMap[c.id] || 0;
    const p = pct(votes, totalVotes);
    const barW = totalVotes ? Math.max(1, votes / totalVotes * 100) : 0;
    return `
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col gap-3">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-full flex items-center justify-center text-white font-bold text-lg flex-shrink-0" style="background:${esc(c.color)}">
            ${c.photo_url ? `<img src="${esc(c.photo_url)}" class="w-12 h-12 rounded-full object-cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt=""><span class="hidden w-12 h-12 rounded-full items-center justify-center text-white font-bold" style="background:${esc(c.color)}">${esc(initials(c.name))}</span>` : esc(initials(c.name))}
          </div>
          <div class="min-w-0">
            <div class="font-semibold truncate">${esc(c.name)}</div>
            ${c.running_mate ? `<div class="text-xs text-slate-500 truncate">&amp; ${esc(c.running_mate)}</div>` : ''}
          </div>
        </div>
        <div class="flex items-end justify-between">
          <span class="text-3xl font-bold" style="color:${esc(c.color)}">${p}%</span>
          <span class="font-mono text-slate-400 text-sm">${votes.toLocaleString()}</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${barW}%;background:${esc(c.color)}"></div>
        </div>
        <div class="text-xs text-slate-600">No. ${c.sequence_number}</div>
      </div>`;
  }).join('');
}

async function drillTo(level, id, path, skipFetch) {
  state.drilldown = { level, id, path };
  let data;
  if (!skipFetch) {
    if (level === 'national') { data = await api('/api/results/provinces'); }
    else if (level === 'province') { data = await api('/api/results/provinces/' + id); }
    else if (level === 'city') { data = await api('/api/results/cities/' + id); }
    else if (level === 'district') { data = await api('/api/results/districts/' + id); }
  } else {
    if (level === 'national') { data = await api('/api/results/provinces'); }
    else if (level === 'province') { data = await api('/api/results/provinces/' + id); }
    else if (level === 'city') { data = await api('/api/results/cities/' + id); }
    else if (level === 'district') { data = await api('/api/results/districts/' + id); }
  }
  renderGeoTable(level, data, path);
}

function renderBreadcrumb(path) {
  const bc = document.getElementById('results-breadcrumb');
  const parts = [{ label: 'National', level: 'national', id: null, path: [] }];
  for (let i = 0; i < path.length; i++) {
    parts.push({ label: path[i].name, level: path[i].level, id: path[i].id, path: path.slice(0, i) });
  }
  bc.innerHTML = parts.map((p, i) => {
    const isLast = i === parts.length - 1;
    if (isLast) return `<span class="text-slate-300">${esc(p.label)}</span>`;
    return `<button onclick="drillTo('${p.level}','${p.id}',${JSON.stringify(p.path)})" class="text-blue-400 hover:underline bg-transparent border-0 cursor-pointer p-0">${esc(p.label)}</button><span class="mx-1">›</span>`;
  }).join('');
}

function renderGeoTable(currentLevel, data, path) {
  path = path || [];
  renderBreadcrumb(path);

  if (currentLevel === 'national') {
    // data is array of provinces
    const rows = Array.isArray(data) ? data : [];
    renderLocationTable(rows, 'province', path);
  } else if (currentLevel === 'province') {
    renderLocationTable(data.cities || [], 'city', path);
  } else if (currentLevel === 'city') {
    renderLocationTable(data.districts || [], 'district', path);
  } else if (currentLevel === 'district') {
    renderTpsTable(data.tps_list || [], path);
  }
}

function renderLocationTable(rows, nextLevel, currentPath) {
  const candidates = state.candidates.slice(0, 4);
  if (!rows.length) {
    document.getElementById('results-table').innerHTML = '<p class="text-slate-500 text-center py-8">No data available.</p>';
    return;
  }

  const headers = candidates.map(c =>
    `<th style="color:${esc(c.color)}">${esc(c.name.split(' ')[0])}</th>`
  ).join('');

  const tbody = rows.map(row => {
    const voteVals = candidates.map(c => parseInt((row.votes || {})[c.id] || 0));
    const totalV = voteVals.reduce((a, b) => a + b, 0);
    const miniBar = candidates.map((c, i) => {
      const w = totalV ? Math.max(2, voteVals[i] / totalV * 80) : 0;
      return `<div class="mini-bar" style="width:${w}px;background:${esc(c.color)}"></div>`;
    }).join('');
    const vCells = voteVals.map(v => `<td class="font-mono text-xs text-slate-400">${v ? v.toLocaleString() : '—'}</td>`).join('');
    const clickPath = [...currentPath, { level: nextLevel, id: row.id, name: row.name }];
    return `<tr class="cursor-pointer" onclick="drillTo('${nextLevel}',${row.id},${JSON.stringify(clickPath)})">
      <td class="font-medium text-blue-400 hover:underline">${esc(row.name)}</td>
      <td class="text-slate-400 text-xs">${row.reported_tps} / ${row.total_tps}</td>
      <td><div class="mini-bar-row">${miniBar}</div></td>
      ${vCells}
    </tr>`;
  }).join('');

  document.getElementById('results-table').innerHTML = `
    <table>
      <thead><tr>
        <th>Location</th>
        <th>Reported</th>
        <th>Distribution</th>
        ${headers}
      </tr></thead>
      <tbody>${tbody}</tbody>
    </table>`;
}

function renderTpsTable(tpsList, path) {
  if (!tpsList.length) {
    document.getElementById('results-table').innerHTML = '<p class="text-slate-500 text-center py-8">No TPS in this district.</p>';
    return;
  }
  const candidates = state.candidates.slice(0, 4);
  const tbody = tpsList.map(t => {
    let statusBadge;
    if (!t.entry_id) {
      statusBadge = '<span class="text-xs text-slate-600">No data</span>';
    } else if (t.entry_status === 'pending') {
      statusBadge = '<span class="text-xs text-amber-500 font-medium">Pending</span>';
    } else {
      statusBadge = '<span class="text-xs text-emerald-400 font-medium">Confirmed</span>';
    }

    const vCells = candidates.map(c => {
      const v = t.entry_status === 'confirmed' ? parseInt((t.votes || {})[c.id] || 0) : null;
      return `<td class="font-mono text-xs text-slate-400">${v !== null ? (v || '0') : '—'}</td>`;
    }).join('');

    const photoLink = t.photo_url
      ? ` <a href="${esc(t.photo_url)}" target="_blank" class="text-blue-400 hover:underline text-xs ml-1" onclick="event.stopPropagation()">photo</a>`
      : '';

    return `<tr>
      <td class="font-mono text-sm">TPS ${esc(t.number)}</td>
      <td>${statusBadge}${photoLink}</td>
      ${vCells}
    </tr>`;
  }).join('');

  const headers = candidates.map(c =>
    `<th style="color:${esc(c.color)}">${esc(c.name.split(' ')[0])}</th>`
  ).join('');

  document.getElementById('results-table').innerHTML = `
    <table>
      <thead><tr>
        <th>TPS</th>
        <th>Status</th>
        ${headers}
      </tr></thead>
      <tbody>${tbody}</tbody>
    </table>`;
}

// ---- Auto-refresh ----

function setupAutoRefresh() {
  if (state.refreshTimer) clearInterval(state.refreshTimer);
  if (state.countdownTimer) clearInterval(state.countdownTimer);
  state.refreshTimer = setInterval(() => {
    if (state.currentView === 'results') refreshResults();
    if (state.currentView === 'pending') loadPending();
  }, 30000);
  state.countdownTimer = setInterval(updateFooter, 1000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - state.lastRefreshed > 15000 && state.currentView === 'results') {
      refreshResults();
    }
  });
}

function updateFooter() {
  const el = document.getElementById('results-footer');
  if (!el) return;
  if (!state.lastRefreshed) { el.textContent = ''; return; }
  const ago = Math.floor((Date.now() - state.lastRefreshed) / 1000);
  const next = Math.max(0, 30 - ago);
  el.textContent = `Last updated ${ago}s ago · Refreshes in ${next}s`;
}

function renderTpsStatusForm(area, tpsId, entry, votes, electionId, isOwnEntry) {
  if (!electionId) {
    area.innerHTML = '<p class="text-slate-500 text-sm">No active election.</p>';
    return;
  }
  if (entry && entry.status === 'confirmed') {
    const voteMap = {};
    for (const v of (votes || [])) voteMap[v.candidate_id] = v.votes;
    area.innerHTML = `
      <div class="bg-emerald-900/30 border border-emerald-700 rounded-lg p-4 mb-4">
        <p class="text-emerald-400 font-medium mb-2">✓ This TPS has been confirmed</p>
        ${state.candidates.map(c => `<div class="flex justify-between text-sm py-1"><span>${esc(c.name)}</span><span class="font-mono">${(voteMap[c.id] || 0).toLocaleString()}</span></div>`).join('')}
        <p class="text-xs text-slate-500 mt-2">Confirmed by ${esc(entry.confirmed_by_username)}</p>
      </div>`;
    return;
  }
  if (entry && entry.status === 'pending' && !isOwnEntry) {
    area.innerHTML = `
      <div class="bg-amber-900/30 border border-amber-700 rounded-lg p-4">
        <p class="text-amber-400 font-medium mb-1">⏳ Pending entry from ${esc(entry.submitted_by_username)}</p>
        <p class="text-sm text-slate-400">This TPS has a pending entry awaiting confirmation.</p>
        <button onclick="showView('pending')" class="btn-primary mt-3 text-sm">Go to Pending tab to confirm →</button>
      </div>`;
    return;
  }

  const voteMap = {};
  if (entry && isOwnEntry) {
    for (const v of (votes || [])) voteMap[v.candidate_id] = v.votes;
  }

  const ownPendingNotice = (entry && isOwnEntry && entry.status === 'pending') ?
    `<div class="bg-amber-900/30 border border-amber-700 rounded-lg p-3 mb-4 text-sm text-amber-400">
      ⏳ Your entry is pending confirmation. Submitting again will replace it.
      <button onclick="withdrawEntry(${entry.id},'${tpsId}','${electionId}')" class="ml-2 underline cursor-pointer bg-transparent border-0 text-amber-400">Withdraw</button>
    </div>` : '';

  const voteInputs = state.candidates.map(c => `
    <div class="flex items-center gap-3 py-2">
      <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-white text-xs font-bold" style="background:${esc(c.color)}">${esc(initials(c.name))}</div>
      <label class="flex-1 m-0 text-sm text-slate-300">${esc(c.name)}${c.running_mate ? ' & ' + esc(c.running_mate) : ''}</label>
      <input type="number" min="0" max="9999" class="w-24 text-right" id="votes-${c.id}" value="${voteMap[c.id] || 0}" placeholder="0">
    </div>`).join('');

  area.innerHTML = `
    ${ownPendingNotice}
    <div class="bg-slate-900 border border-slate-800 rounded-lg p-5">
      <h3 class="font-semibold mb-4">Enter vote counts</h3>
      <div class="divide-y divide-slate-800 mb-4">${voteInputs}</div>
      <div class="space-y-3 mb-5">
        <div>
          <label for="submit-photo">Photo URL (optional)</label>
          <input type="url" id="submit-photo" placeholder="https://...">
        </div>
        <div>
          <label for="submit-notes">Notes (optional)</label>
          <textarea id="submit-notes" rows="2" placeholder="Any notes…" style="resize:vertical"></textarea>
        </div>
      </div>
      <button onclick="submitEntry('${tpsId}','${electionId}')" class="btn-primary w-full">Submit Entry</button>
      <div id="submit-result" class="mt-3"></div>
    </div>`;
}

async function submitEntry(tpsId, electionId) {
  const votes = state.candidates.map(c => ({
    candidate_id: c.id,
    votes: parseInt(document.getElementById('votes-' + c.id).value) || 0
  }));
  const photo_url = document.getElementById('submit-photo').value.trim() || null;
  const notes = document.getElementById('submit-notes').value.trim() || null;

  try {
    await api('/api/entries', { method: 'POST', body: { tps_id: parseInt(tpsId), election_id: parseInt(electionId), votes, photo_url, notes } });
    document.getElementById('submit-result').innerHTML =
      `<p class="text-emerald-400 text-sm">✓ Entry submitted! It needs one more person to confirm it.</p>`;
    // Re-load status
    const { entry, votes: ev, election_id, is_own_entry } = await api('/api/tps/' + tpsId + '/status');
    renderTpsStatusForm(document.getElementById('tps-status-area'), tpsId, entry, ev, election_id, is_own_entry);
    updatePendingBadge();
  } catch (e) {
    document.getElementById('submit-result').innerHTML =
      `<p class="text-red-400 text-sm">${esc(e.message)}</p>`;
  }
}

async function withdrawEntry(entryId, tpsId, electionId) {
  try {
    await api('/api/entries/' + entryId + '/withdraw', { method: 'POST' });
    const { entry, votes, election_id, is_own_entry } = await api('/api/tps/' + tpsId + '/status');
    renderTpsStatusForm(document.getElementById('tps-status-area'), tpsId, entry, votes, election_id, is_own_entry);
    updatePendingBadge();
  } catch (e) {
    alert('Failed to withdraw: ' + e.message);
  }
}

async function loadPending() {
  const list = document.getElementById('pending-list');
  list.innerHTML = '<p class="text-slate-500 text-sm">Loading…</p>';
  try {
    const entries = await api('/api/entries/pending');
    updatePendingBadge(entries.length);
    if (!entries.length) {
      list.innerHTML = '<p class="text-slate-500 py-8 text-center">No pending entries right now.</p>';
      return;
    }
    list.innerHTML = entries.map(e => {
      const voteMap = {};
      for (const v of (e.votes || [])) voteMap[v.candidate_id] = v.votes;
      const voteSummary = state.candidates.map(c =>
        `<span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full inline-block" style="background:${esc(c.color)}"></span><span class="text-xs">${(voteMap[c.id] || 0)}</span></span>`
      ).join('<span class="text-slate-700 mx-1">·</span>');

      const isOwn = e.submitted_by_user_id === state._myUserId;

      return `<div class="bg-slate-900 border border-slate-800 rounded-lg p-4 mb-3">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <div class="font-medium">TPS ${esc(e.tps_number)} — ${esc(e.district_name)}, ${esc(e.city_name)}</div>
            <div class="text-sm text-slate-500">${esc(e.province_name)}</div>
            <div class="text-sm text-slate-400 mt-1">Submitted by <strong>${esc(e.submitted_by_username)}</strong></div>
            <div class="mt-2 flex gap-2 flex-wrap">${voteSummary}</div>
            ${e.photo_url ? `<a href="${esc(e.photo_url)}" target="_blank" class="text-xs text-blue-400 hover:underline mt-1 block">View photo →</a>` : ''}
          </div>
          <div class="flex gap-2 flex-shrink-0">
            <button onclick="confirmEntry(${e.id})" class="btn-success" id="confirm-btn-${e.id}">Confirm</button>
            <button onclick="rejectEntry(${e.id})" class="btn-danger" id="reject-btn-${e.id}">Reject</button>
          </div>
        </div>
      </div>`;

  } catch (err) {
    list.innerHTML = `<p class="text-red-400 text-sm">${esc(err.message)}</p>`;
  }
}

  try {
    await api('/api/entries/' + id + '/confirm', { method: 'POST' });

    alert(e.message);

}

async function rejectEntry(id) {

  }

async function updatePendingBadge(count) {
  try {
    if (count === undefined) {
      const entries = await api('/api/entries/pending');
      count = entries.length;
    }
    const badge = document.getElementById('pending-badge');
    if (count > 0) {
      badge.textContent = count;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  } catch (_) {}
}

function showAdminTab(name) {
  document.querySelectorAll('.admin-tab').forEach(btn => {
    const active = btn.dataset.atab === name;
    btn.style.borderBottomColor = active ? '#3b82f6' : 'transparent';
    btn.style.color = active ? '#f1f5f9' : '';
  });
  document.querySelectorAll('.admin-tab-content').forEach(el => {
    el.classList.toggle('hidden', el.id !== 'admin-tab-' + name);
  });
  if (name === 'election') renderAdminElection();
  else if (name === 'candidates') renderAdminCandidates();
  else if (name === 'geography') renderAdminGeography();
  else if (name === 'entries') renderAdminEntries();
  else if (name === 'admins') renderAdminAdmins();

async function renderAdminEntries() {
  const el = document.getElementById('admin-tab-entries');
  el.innerHTML = '<p class="text-slate-500 text-sm">Loading…</p>';
  try {
    const entries = await api('/api/admin/entries');
    if (!entries.length) {
      el.innerHTML = '<p class="text-slate-500 text-center py-8">No entries yet.</p>';
      return;
    }
    const rows = entries.map(e => {
      const voteMap = {};
      for (const v of (e.votes || [])) voteMap[v.candidate_id] = v.votes;
      const voteSummary = state.candidates.map(c =>
        `<span class="text-xs font-mono" style="color:${esc(c.color)}">${(voteMap[c.id] || 0)}</span>`
      ).join(' ');
      const statusColor = { pending: 'text-amber-400', confirmed: 'text-emerald-400', rejected: 'text-red-400', withdrawn: 'text-slate-600' };
      const actions = e.status === 'pending'
        ? `<button onclick="adminConfirmEntry(${e.id})" class="btn-success text-xs mr-1">Confirm</button><button onclick="adminRejectEntry(${e.id})" class="btn-danger text-xs">Reject</button>`
        : e.status === 'confirmed'
        ? `<button onclick="adminResetEntry(${e.id})" class="btn-ghost text-xs">Reset</button>`
        : '';
      return `<tr>
        <td class="font-mono text-xs">TPS ${esc(e.tps_number)}<br><span class="text-slate-500">${esc(e.district_name)}</span></td>
        <td class="text-xs"><div class="${statusColor[e.status] || 'text-slate-400'} font-medium">${e.status}</div><div class="text-slate-500">${esc(e.submitted_by_username)}</div></td>
        <td class="text-xs">${voteSummary}</td>
        <td>${actions}</td>
      </tr>`;
    }).join('');

    el.innerHTML = `<div class="overflow-x-auto"><table>
      <thead><tr><th>TPS</th><th>Status / By</th><th>Votes</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  } catch (e) {
    el.innerHTML = `<p class="text-red-400 text-sm">${esc(e.message)}</p>`;
  }
}
